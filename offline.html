<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070914" />
    <title>Bağlantı yok · Ezoter.ist</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: radial-gradient(circle at 50% 30%, #1b1f4a, #070914 70%); color: #f4f1ea; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      img { width: 140px; height: 140px; border-radius: 28px; }
      h1 { margin: 18px 0 6px; font: 700 1.6rem Georgia, serif; color: #f3c26b; }
      p { margin: 0 auto 20px; max-width: 320px; color: #c3bdd6; }
      button { padding: 12px 26px; border: 0; border-radius: 999px; background: #ff7a00; color: #fff; font: 700 1rem system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="Ezoter.ist" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Yorumlar yapay zekâ ile o an hazırlandığı için Ezoter.ist'i kullanmak için bağlantı gerekiyor. Bağlantın gelince yeniden dene.</p>
      <button type="button" onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
