<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070914" />
    <meta name="description" content="Ezoter.ist hesabınıza giriş yapın veya yeni hesap oluşturun." />
    <title>Ezoter.ist Girişi</title>
    <link rel="icon" href="/favicon.png?v=1" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/login.css?v=5" />
  </head>
  <body>
    <a class="auth-back" id="authBack" href="/">← Geri</a>
    <main class="auth-card">
      <a class="auth-brand" href="/" aria-label="Ezoter.ist ana sayfa">
        <img src="/favicon.svg" alt="" width="44" height="44" />
        <span>Ezoter.ist</span>
      </a>

      <h1 id="authTitle">Ezoter.ist Girişi</h1>
      <p class="auth-subtitle" id="authSubtitle">Hesabına giriş yap ve kaldığın yerden devam et.</p>

      <div class="auth-tabs" role="tablist" aria-label="Giriş veya kayıt">
        <button type="button" role="tab" id="tabLogin" data-mode="login" aria-selected="true" aria-controls="loginForm">Giriş Yap</button>
        <button type="button" role="tab" id="tabRegister" data-mode="register" aria-selected="false" aria-controls="registerForm">Kayıt Ol</button>
      </div>

      <div id="socialLogin">
      <a class="google-button" href="/auth/google">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        <span id="googleLabel">Google ile giriş yap</span>
      </a>

      <div class="auth-divider"><span>veya e-posta ile</span></div>
      </div>

      <p class="auth-message" id="authMessage" role="alert" hidden></p>

      <form id="loginForm" class="auth-form" role="tabpanel" aria-labelledby="tabLogin">
        <label>
          <span>E-posta</span>
          <input type="email" name="email" autocomplete="email" placeholder="ornek@eposta.com" required />
        </label>
        <label>
          <span>Şifre</span>
          <input type="password" name="password" autocomplete="current-password" placeholder="Şifreniz" required />
        </label>
        <div class="auth-options">
          <label class="auth-remember">
            <input type="checkbox" name="remember" checked />
            <span>Beni hatırla</span>
          </label>
          <a class="auth-forgot" href="/forgot-password" data-mode="forgot">Şifremi unuttum?</a>
        </div>
        <button type="submit" class="auth-submit">Giriş Yap</button>
      </form>

      <form id="registerForm" class="auth-form" role="tabpanel" aria-labelledby="tabRegister" hidden>
        <label>
          <span>Ad Soyad</span>
          <input type="text" name="name" autocomplete="name" placeholder="Adınız Soyadınız" maxlength="100" />
        </label>
        <label>
          <span>E-posta</span>
          <input type="email" name="email" autocomplete="email" placeholder="ornek@eposta.com" required />
        </label>
        <label>
          <span>Şifre</span>
          <input type="password" name="password" autocomplete="new-password" placeholder="En az 8 karakter" minlength="8" required />
        </label>
        <label>
          <span>Şifre (tekrar)</span>
          <input type="password" name="passwordConfirm" autocomplete="new-password" placeholder="Şifrenizi tekrar girin" minlength="8" required />
        </label>
        <button type="submit" class="auth-submit">Kayıt Ol</button>
      </form>

      <form id="verifyForm" class="auth-form" hidden>
        <label>
          <span>Doğrulama kodu</span>
          <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 haneli kod" required />
        </label>
        <button type="submit" class="auth-submit">Kaydı Tamamla</button>
        <button type="button" class="auth-link-button" id="resendRegisterCode">Kodu tekrar gönder</button>
      </form>

      <form id="forgotForm" class="auth-form" hidden>
        <label>
          <span>E-posta</span>
          <input type="email" name="email" autocomplete="email" placeholder="ornek@eposta.com" required />
        </label>
        <button type="submit" class="auth-submit">Kod Gönder</button>
      </form>

      <form id="resetForm" class="auth-form" hidden>
        <label>
          <span>Doğrulama kodu</span>
          <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 haneli kod" required />
        </label>
        <label>
          <span>Yeni şifre</span>
          <input type="password" name="password" autocomplete="new-password" placeholder="En az 8 karakter" minlength="8" required />
        </label>
        <label>
          <span>Yeni şifre (tekrar)</span>
          <input type="password" name="passwordConfirm" autocomplete="new-password" placeholder="Şifrenizi tekrar girin" minlength="8" required />
        </label>
        <button type="submit" class="auth-submit">Şifremi Yenile</button>
        <button type="button" class="auth-link-button" id="resendCode">Kodu tekrar gönder</button>
      </form>

      <p class="auth-switch" id="authSwitch"></p>
    </main>
    <script src="/login.js?v=5"></script>
  </body>
</html>
