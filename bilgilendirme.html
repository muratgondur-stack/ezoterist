<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070914" />
    <meta name="description" content="Ezoter.ist hoş geldiniz bilgilendirmesi: içeriklerin niteliği ve sorumluluk." />
    <title>Bilgilendirme · Ezoter.ist</title>
    <link rel="icon" href="/favicon.png?v=1" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/astroloji.css?v=14" />
    <link rel="stylesheet" href="/hukuk.css?v=3" />
    <link rel="stylesheet" href="/bilgilendirme.css?v=2" />
  </head>
  <body>
    <header class="topbar">
      <a class="topbar-back" href="/" aria-label="Ana menü" title="Ana menü">←</a>
      <a class="topbar-logo" href="/" aria-label="Ezoter.ist ana sayfa"><picture><source media="(orientation: portrait) and (max-width: 600px)" srcset="/logo/ezo_E.png?v=1" width="1247" height="216" /><img src="/logo/ezo_D.png?v=1" alt="Ezoter.ist" width="1247" height="77" /></picture></a>
      <span class="topbar-user" id="topbarUser"></span>
    </header>

    <main class="page bilgi-sayfa" id="bilgiSayfa"></main>
    <script src="/bilgilendirme-metin.js?v=2"></script>
    <script>
      (async () => {
        const sayfa = document.getElementById("bilgiSayfa");
        sayfa.append(Bilgilendirme.icerik());
        const d = await fetch("/api/me", { credentials: "same-origin" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
        if (d?.user?.bilgilendirmeOnay && !d.user.bilgilendirmeGerekli) {
          const p = document.createElement("p");
          p.className = "bilgi-durum ok";
          p.textContent = `✓ Bu bilgilendirmeyi ${new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }).format(new Date(d.user.bilgilendirmeOnay))} tarihinde onayladın.`;
          sayfa.append(p);
        }
      })();
    </script>
    <script src="/ust-cubuk.js?v=12" defer></script>
  </body>
</html>
